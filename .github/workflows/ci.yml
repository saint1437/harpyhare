name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: фронтенд и линтеры
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks комментирует находки прямо в PR
    steps:
      - uses: actions/checkout@v5
        with:
          # И `nx affected`, и gitleaks смотрят в историю: поверхностный клон им не годится.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Кэш Nx восстанавливается везде, но пишется только с main и с тегов — тот же
      # компромисс, что у Swatinem/rust-cache ниже: иначе PR-ы вытесняют друг друга
      # из общего лимита репозитория, и попадания становятся случайными.
      - uses: actions/cache/restore@v4
        id: nx-cache
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-
      - run: npm ci
      - uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'pull_request'
      # На PR гоняем только затронутое, на main, тегах и ручном запуске — всё целиком.
      # `build` здесь обязателен: он ловит границы RSC у Next и ошибки `tsc -b`,
      # которых не видит ни typecheck, ни lint.
      - name: Проверки затронутых проектов
        if: github.event_name == 'pull_request'
        run: npx nx affected -t typecheck lint test build
      - name: Проверки всех проектов
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t typecheck lint test build
      - name: Мёртвый код и зависимости
        run: npx knip
      # В рабочей копии рядом лежат .env с ключом и .admin-token: они в .gitignore,
      # но от будущего коммита это не защищает — gitleaks смотрит на то, что реально
      # попало в историю. Лицензия нужна только организациям, репозиторий личный.
      - name: Секреты в коммитах
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/save@v4
        if: always() && github.event_name == 'push' && steps.nx-cache.outputs.cache-hit != 'true'
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}

  macos:
    name: тесты Rust и контракт
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      # dtolnay/rust-toolchain сам rust-toolchain.toml не читает, поэтому канал
      # вынимаем руками: появится файл — CI подхватит его без правок, не появится —
      # останется stable.
      - name: Канал Rust
        id: rust
        working-directory: .
        shell: bash
        run: |
          channel=""
          for f in rust-toolchain.toml apps/desktop/src-tauri/rust-toolchain.toml; do
            if [ -f "$f" ]; then
              channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -n1)
              [ -n "$channel" ] && break
            fi
          done
          echo "toolchain=${channel:-stable}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      - name: Тесты Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Контракт не разъехался с закоммиченным
        run: git diff --exit-code src/ipc/bindings.ts
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Clippy в релизном профиле
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --release -- -D warnings

  windows:
    name: сборка под Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      BUILD_INSTALLER: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Вывести пути сборки из-под Defender
        continue-on-error: true
        working-directory: .
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Канал Rust
        id: rust
        working-directory: .
        shell: bash
        run: |
          channel=""
          for f in rust-toolchain.toml apps/desktop/src-tauri/rust-toolchain.toml; do
            if [ -f "$f" ]; then
              channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -n1)
              [ -n "$channel" ] && break
            fi
          done
          echo "toolchain=${channel:-stable}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      - name: Установить зависимости
        run: npm ci
        working-directory: .
      - name: Clippy, он же компиляция тестов
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Собрать установщик
        if: env.BUILD_INSTALLER == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build
          fi
      - uses: actions/upload-artifact@v4
        if: env.BUILD_INSTALLER == 'true'
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

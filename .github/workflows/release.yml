name: release

# Релиз двухплатформенный, и неполный latest.json ломает обновления не частично:
# updater отвергает КАЖДЫЙ check() с TargetsNotFound независимо от версии
# пользователя. Пока релиз собирали руками в два прохода на двух машинах, окно
# «одна платформа уже есть, вторая ещё нет» было неизбежным. Здесь обе платформы
# собираются параллельно, а релиз создаётся один раз и только когда готовы обе:
# неполный релиз становится структурно невозможным, а ключ подписи перестаёт быть
# у одного человека на маке.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.13.0"
        required: true
      notes:
        description: "Описание релиза (пусто — возьмётся из CHANGELOG.md)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Ни репозитория релизов, ни слага ассета здесь больше нет: их печатает
  # packages/release-contract/scripts/release-names.mjs — шаг «Имена ассетов из
  # контракта» есть в обоих джобах. PRODUCT_NAME остаётся: это productName из
  # tauri.conf.json, то есть имя, под которым tauri кладёт файлы в bundle/, а не
  # имя релизного ассета.
  PRODUCT_NAME: Audio System

jobs:
  bundle:
    name: бандл ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Обе платформы гоняются до конца: если упадут обе, видеть надо обе причины.
    # Публикация всё равно не начнётся — она в needs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-aarch64
          - runner: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Вывести пути сборки из-под Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: .
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Канал Rust
        id: rust
        working-directory: .
        shell: bash
        run: |
          channel=""
          for f in rust-toolchain.toml apps/desktop/src-tauri/rust-toolchain.toml; do
            if [ -f "$f" ]; then
              channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -n1)
              [ -n "$channel" ] && break
            fi
          done
          echo "toolchain=${channel:-stable}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Релизная сборка бывает только на теге — тут кэш и пишется, иначе
          # каждый релиз стартовал бы холодным.
          save-if: true

      - name: Установить зависимости
        run: npm ci
        working-directory: .

      # Версия в тегe и версия в манифестах обязаны совпадать: имена артефактов
      # собираются из package.json, а латест — из тега, и разъехавшись они дают
      # релиз со ссылками в никуда.
      - name: Тег совпадает с версией в манифестах
        id: version
        working-directory: .
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$pkg" != "$version" ] || [ "$conf" != "$version" ]; then
            echo "::error::тег $tag, package.json $pkg, tauri.conf.json $conf — версии разъехались"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Имена ассетов приходят из того же packages/release-contract/release-assets.json,
      # по которому их строит apps/desktop/scripts/release.mjs, ищет лендинг и
      # проверяет Rust. Раньше они были выписаны в шелле ниже руками, и совпадение
      # ловил только тест; теперь совпадать нечему — имя одно и приходит оттуда.
      # Скрипт зовётся по пути, а не как @harpyhare/release-contract: джоб publish
      # не делает npm ci, node_modules там нет.
      - name: Имена ассетов из контракта
        working-directory: .
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node packages/release-contract/scripts/release-names.mjs \
            --version "$VERSION" --target "$PLATFORM" | tee -a "$GITHUB_ENV"

      # Релиз без подписи бесполезен: updater проверяет minisign и молча
      # откажется ставить неподписанный бандл. Поэтому здесь секрет обязателен,
      # в отличие от ci.yml, где его отсутствие лишь отключает updater-артефакты.
      - name: Собрать и подписать
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::нет секрета TAURI_SIGNING_PRIVATE_KEY — релиз без подписи не ставится"
            exit 1
          fi
          npx tauri build

      # Слева от `cp` — то, как файлы называет tauri (productName и его же
      # архитектуры: aarch64 на маке, x64 на windows). Справа — имена релиза,
      # целиком из контракта. Разъехаться они не могут: справа литералов нет.
      - name: Разложить артефакты под именами релиза
        working-directory: .
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          bundle="apps/desktop/src-tauri/target/release/bundle"
          mkdir -p staging/assets staging/meta
          if [ "$PLATFORM_KEY" = "macos" ]; then
            # Единственное исключение из схемы: этот архив tauri называет одним
            # productName, без версии и архитектуры.
            updater="$bundle/macos/${PRODUCT_NAME}${UPDATER_SUFFIX}"
            cp "$updater" "staging/assets/${UPDATER_NAME}"
            cp "$bundle/dmg/${PRODUCT_NAME}_${VERSION}_aarch64${INSTALLER_SUFFIX}" \
               "staging/assets/${INSTALLER_NAME}"
          else
            # На windows updater-артефакт И ЕСТЬ установщик — файл один.
            updater="$bundle/nsis/${PRODUCT_NAME}_${VERSION}_x64${INSTALLER_SUFFIX}"
            cp "$updater" "staging/assets/${INSTALLER_NAME}"
          fi
          echo "${UPDATER_NAME}" > "staging/meta/${PLATFORM}.name"
          # Подпись едет отдельным файлом: в релиз она не выкладывается, её
          # содержимое уходит внутрь манифеста обновления.
          cp "${updater}${SIGNATURE_SUFFIX}" "staging/meta/${PLATFORM}.sig"
          ls -R staging

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: staging
          if-no-files-found: error
          retention-days: 7

  publish:
    name: собрать манифест обновления и опубликовать
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      # Тот же скрипт, что и в bundle, но без --target: здесь нужны не имена
      # ассетов, а репозиторий релизов, имя манифеста и список платформ, которых
      # в манифесте обязано быть ровно столько, сколько знает updater.
      - name: Имена ассетов из контракта
        working-directory: .
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node packages/release-contract/scripts/release-names.mjs \
            --version "${TAG#v}" | tee -a "$GITHUB_ENV"

      - name: Собрать манифест обновления из обеих платформ
        id: manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          cat > /tmp/manifest.cjs <<'EOF'
          const { readFileSync, writeFileSync, mkdirSync, copyFileSync, readdirSync, existsSync } = require("node:fs");
          const { join } = require("node:path");

          const REQUIRED = process.env.REQUIRED_TARGETS.split(",");
          const manifest = process.env.MANIFEST_NAME;
          const tag = process.env.TAG;
          const version = tag.replace(/^v/, "");
          const repo = process.env.RELEASES_REPO;

          const out = "release-assets";
          mkdirSync(out, { recursive: true });

          const platforms = {};
          for (const platform of REQUIRED) {
            const dir = join("downloaded", `bundle-${platform}`);
            if (!existsSync(dir)) throw new Error(`нет артефакта для ${platform} — публиковать нечего`);
            const sig = readFileSync(join(dir, "meta", `${platform}.sig`), "utf8").trim();
            const name = readFileSync(join(dir, "meta", `${platform}.name`), "utf8").trim();
            if (!sig) throw new Error(`пустая подпись для ${platform}`);
            platforms[platform] = {
              signature: sig,
              url: `https://github.com/${repo}/releases/download/${tag}/${name}`,
            };
            for (const asset of readdirSync(join(dir, "assets"))) {
              copyFileSync(join(dir, "assets", asset), join(out, asset));
            }
          }

          // Описание: параметр workflow_dispatch, иначе — секция версии из CHANGELOG.md.
          let notes = (process.env.NOTES || "").trim();
          if (!notes && existsSync("CHANGELOG.md")) {
            const md = readFileSync("CHANGELOG.md", "utf8");
            const section = md.split(/^## /m).find((part) => part.startsWith(`[${version}]`));
            if (section) notes = section.replace(/^\[[^\]]+\][^\n]*\n/, "").trim();
          }
          if (!notes) notes = `${tag}`;

          writeFileSync(
            join(out, manifest),
            JSON.stringify({ version, notes, pub_date: new Date().toISOString(), platforms }, null, 2) + "\n",
          );

          const missing = REQUIRED.filter((p) => !platforms[p]);
          if (missing.length) throw new Error(`в ${manifest} не хватает ${missing.join(", ")}`);
          console.log("ассеты:", readdirSync(out).join(", "));
          EOF
          node /tmp/manifest.cjs
          ls -l release-assets

      # Токен нужен чужой: релизы лежат в отдельном репозитории, а встроенного
      # GITHUB_TOKEN туда не хватает. См. README, раздел «Релиз».
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::нет секрета RELEASES_REPO_TOKEN — в чужой репозиторий релиз не создать"
            exit 1
          fi
          version="${TAG#v}"
          notes=$(node -p "require('./release-assets/' + process.env.MANIFEST_NAME).notes")
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$RELEASES_REPO" --clobber release-assets/*
            gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false
          else
            gh release create "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "$PRODUCT_NAME $version" \
              --notes "$notes" \
              release-assets/*
          fi

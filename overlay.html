<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html {
        background: transparent;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 36px;
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0) 60%), #0a0a0b;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        color: #f0c8cc;
        font:
          600 12.5px/1 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        letter-spacing: 0.02em;
      }
      .orb {
        position: relative;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #e2697a, #9b1c2e 65%);
        box-shadow: 0 0 12px rgba(155, 28, 46, 0.8);
      }
      .orb::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 1px solid rgba(226, 59, 78, 0.7);
        animation: ripple 1.3s ease-out infinite;
      }
      @keyframes ripple {
        from {
          transform: scale(0.55);
          opacity: 1;
        }
        to {
          transform: scale(1.7);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb"></div>
    Запись
  </body>
</html>

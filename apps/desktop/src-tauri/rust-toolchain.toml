# Pinned on purpose, and the reason is a bug that was found in this tree.
#
# The chat-image store used to name files with `DefaultHasher`, whose algorithm
# std explicitly does not guarantee across releases: a floating `stable` in CI
# could rebuild the app with a different hash, every id in `chats.json` would
# stop resolving, and `prune_chat_images` would then delete the files as
# unreferenced. The hash itself is pinned now (SHA-256, `chat_images.rs`), but a
# floating toolchain is the class of problem that made it reachable — so the
# version is stated rather than inherited.
#
# `components` deliberately lists only clippy: it is the one component CI runs
# (`cargo fmt` is not used anywhere in this repository), and every extra name
# here is another download rustup has to make before the first build.
#
# Locally, the first build after this file appears may ask rustup to fetch the
# toolchain: `rustup toolchain install 1.97.1`.
[toolchain]
channel = "1.97.1"
components = ["clippy"]

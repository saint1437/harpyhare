[package]
name = "harpyhare"
version = "0.12.0"
description = "Системный звук → STT → Claude (push-to-talk ассистент для macOS и Windows)"
authors = ["mark"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harpyhare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.2"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
thiserror = "2.0.18"
base64 = "0.22.1"
hound = "3.5.1"
rubato = "3.0.0"
futures-util = "0.3.32"
# Only the pieces this crate actually uses: `spawn`/`spawn_blocking` (rt-multi-thread),
# `select!`/`join!`/`#[tokio::test]` (macros), `sleep`/`interval` (time), `mpsc`/`oneshot`
# (sync). `net`/`io-util` still arrive through reqwest and tauri via feature unification;
# what this drops is `fs`, `process`, `signal` and `io-std`.
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.18"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
async-trait = "0.1.89"
dotenvy = "0.15.7"
ringbuf = "0.4.8"
tauri-plugin-updater = "2.10.1"
pdf-extract = "0.12"
specta = "2.0.0-rc"
# The TypeScript exporter is only reachable from `bindings::tests`, so the
# `typescript` feature (and specta-typescript with it) is re-enabled below under
# [dev-dependencies] instead of being compiled into every release build.
tauri-specta = { version = "2.0.0-rc", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = "0.15.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSEvent", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.17"
windows = { version = "0.61", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
# `cargo test` regenerates src/ipc/bindings.ts (bindings::tests), which is the only
# place the exporter is used.
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc", features = ["typescript"] }

# Debug builds are the bulk of target/ (18 GB measured). Line tables keep backtraces and
# panic locations while dropping the type/variable DWARF nobody steps through here.
# Dependencies are built once, so they are worth optimising; the crate itself stays at
# opt-level 0 so incremental rebuilds stay cheap.
#
# `split-debuginfo` is deliberately NOT set: `unpacked` is already cargo's dev default on
# macOS, and on x86_64-pc-windows-msvc rustc rejects it outright ("`-Csplit-debuginfo=
# unpacked` is unstable on this platform") — the windows CI job runs `cargo clippy
# --all-targets`, i.e. the dev profile, so setting it here would fail that job for nothing.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

